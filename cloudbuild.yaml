steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gcpdevops:$SHORT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gcpdevops:$SHORT_SHA']

  # Fetch credentials for the target GKE cluster
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'container'
      - 'clusters'
      - 'get-credentials'
      - '${_CLUSTER_NAME}'
      - '--zone'
      - '${_CLUSTER_ZONE}'
      - '--project'
      - '$PROJECT_ID'

  # Apply the Kubernetes manifests for the target environment (dev/stage/prod),
  # each an overlay of k8s/base built with kustomize
  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['apply', '-k', 'k8s/overlays/${_ENV}']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'

  # Point the deployment at the image just built (namespace == environment name)
  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['set', 'image', 'deployment/gcpdevops-app', 'gcpdevops=gcr.io/$PROJECT_ID/gcpdevops:$SHORT_SHA', '-n', '${_ENV}']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'

# Images to push to Container Registry after a successful build
images:
  - 'gcr.io/$PROJECT_ID/gcpdevops:$SHORT_SHA'

# Defaults for which environment/cluster to deploy to.
# Override with --substitutions=_ENV=stage,_CLUSTER_NAME=...,_CLUSTER_ZONE=... or per-trigger config.
substitutions:
  _ENV: dev
  _CLUSTER_NAME: your-gke-cluster
  _CLUSTER_ZONE: us-central1-a
