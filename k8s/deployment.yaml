apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcpdevops-app
  labels:
    app: gcpdevops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gcpdevops
  template:
    metadata:
      labels:
        app: gcpdevops
    spec:
      containers:
        - name: gcpdevops
          image: gcr.io/PROJECT_ID/gcpdevops:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
